[project]
name = "receipts-analysis-service"
version = "1.0.0"
description = "Python-based microservice that extracts structured data from receipt images using OCR, rule-based parsing, and machine learning-based product classification"
authors = [
    {name = "chedv",email = "chernovdv001@gmail.com"}
]
requires-python = "^3.13"
dependencies = [
    "fastapi (>=0.129.0,<0.130.0)",
    "uvicorn (>=0.40.0,<0.41.0)",
    "python-multipart (>=0.0.22,<0.0.23)",
    "pydantic-settings (>=2.13.0,<3.0.0)",
    "aioboto3 (>=15.5.0,<16.0.0)",
    "types-aiobotocore-s3 (>=3.1.3,<4.0.0)",
    "celery (>=5.6.2,<6.0.0)",
    "redis (>=7.1.1,<8.0.0)",
    "sqlalchemy (>=2.0.46,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.11,<3.0.0)",
    "paddleocr (>=3.4.0,<4.0.0)",
    "paddlepaddle (==3.2.0)",
    "pyjwt (>=2.11.0,<3.0.0)",
    "fastapi-decorators (>=1.0.19,<2.0.0)",
    "cryptography (>=46.0.5,<47.0.0)",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
]
